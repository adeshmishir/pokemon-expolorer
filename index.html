<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A production-quality Pokémon Explorer built with React, Vite, and Tailwind CSS."
    />
    <title>Pokédex — Adesh Mishra</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pokemon-theme");
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme:dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
